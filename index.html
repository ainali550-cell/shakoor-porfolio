<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shakoor Malik | AI Workflow & Web Engineering Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@1,400;1,500;1,600&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              serif: ['"Cormorant Garamond"', 'serif'],
            }
          }
        }
      }
    </script>
    <style>
        html { scroll-behavior: smooth; background-color: #0b0f19; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.01); }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.08); border-radius: 99px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(56, 189, 248, 0.3); }
    </style>
</head>
<body class="bg-[#0b0f19] text-slate-100 min-h-screen font-sans selection:bg-sky-500 selection:text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
    function App() {
      const words = ["Professional Prompt Engineer", "Software Developer", "Web Designer", "AI Trainer"];
      const [wordIndex, setWordIndex] = React.useState(0);
      const [charIndex, setCharIndex] = React.useState(0);
      const [isDeleting, setIsDeleting] = React.useState(false);
      const [typedText, setTypedText] = React.useState('');

      // Guestbook Matrix
      const [guestbook, setGuestbook] = React.useState([
        { name: "Ali Raza", msg: "Exceptional prompt workflows on The Lex Vault!", date: "May 2026" },
        { name: "M. Asif", msg: "The UI design optimization for local platforms is game-changing.", date: "April 2026" }
      ]);
      const [gbName, setGbName] = React.useState('');
      const [gbMessage, setGbMessage] = React.useState('');
      const [contactForm, setContactForm] = React.useState({ name: '', email: '', message: '' });
      const [formSubmitted, setFormSubmitted] = React.useState(false);

      React.useEffect(() => {
        let timer;
        const currentWord = words[wordIndex];
        
        const handleTyping = () => {
          if (isDeleting) {
            setTypedText(currentWord.substring(0, charIndex - 1));
            setCharIndex(prev => prev - 1);
          } else {
            setTypedText(currentWord.substring(0, charIndex + 1));
            setCharIndex(prev => prev + 1);
          }
        };

        let speed = isDeleting ? 40 : 100;

        if (!isDeleting && charIndex === currentWord.length) {
          speed = 2000; 
          setIsDeleting(true);
        } else if (isDeleting && charIndex === 0) {
          setIsDeleting(false);
          setWordIndex(prev => (prev + 1) % words.length);
          speed = 400;
        }

        timer = setTimeout(handleTyping, speed);
        return () => clearTimeout(timer);
      }, [charIndex, isDeleting, wordIndex]);

      const handleGuestbookSubmit = (e) => {
        e.preventDefault();
        if (!gbName.trim() || !gbMessage.trim()) return;
        setGuestbook([{ name: gbName, msg: gbMessage, date: "Just Now" }, ...guestbook]);
        setGbName('');
        setGbMessage('');
      };

      const handleContactSubmit = (e) => {
        e.preventDefault();
        setFormSubmitted(true);
        setTimeout(() => {
          setFormSubmitted(false);
          setContactForm({ name: '', email: '', message: '' });
        }, 4000);
      };

      return (
        <div>
          {/* Header */}
          <header className="fixed top-0 w-full z-50 bg-[#0f172a]/80 backdrop-blur-xl border-b border-white/5">
            <div className="max-w-6xl mx-auto px-6 h-20 flex justify-between items-center">
              <div className="text-xl font-bold tracking-tight bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">
                Shakoor Malik
              </div>
              <nav className="hidden md:flex items-center gap-8 text-sm font-medium text-slate-400">
                <a href="#about" className="hover:text-sky-400 transition">About</a>
                <a href="#portfolio" className="hover:text-sky-400 transition">Projects</a>
                <a href="#advocacy" className="hover:text-sky-400 transition">Impact</a>
                <a href="#bench" className="hover:text-sky-400 transition">The Bench</a>
                <a href="#blog" className="hover:text-sky-400 transition">Insights</a>
                <a href="#contact" className="hover:text-sky-400 transition-colors bg-sky-500/10 text-sky-400 px-4 py-1.5 rounded-full border border-sky-500/20 hover:bg-sky-500/20">Connect</a>
              </nav>
            </div>
          </header>

          {/* Hero */}
          <section className="relative min-h-screen flex items-center justify-center pt-20 px-6 overflow-hidden">
            <div className="absolute inset-0 bg-[radial-gradient(circle_at_top,rgba(56,189,248,0.07),transparent_50%)]" />
            <div className="max-w-4xl mx-auto text-center relative z-10">
              <span className="px-3 py-1 rounded-full text-xs font-semibold tracking-wider bg-sky-500/10 text-sky-400 border border-sky-500/20 uppercase">
                Available for Global AI & Web Engineering Tasks
              </span>
              <h1 className="text-5xl md:text-7xl font-bold tracking-tight text-white mt-6 mb-4">
                Shakoor Malik
              </h1>
              <h2 className="text-xl md:text-3xl text-slate-400 font-medium h-12">
                <span>{typedText}</span>
                <span className="inline-block w-[3px] h-6 bg-sky-400 ml-1 animate-pulse">|</span>
              </h2>
              
              <p className="max-w-2xl mx-auto text-lg md:text-xl font-serif italic text-slate-300 my-8 leading-relaxed border-l-2 border-sky-500/30 pl-4">
                "Software architecture meets premium visual design. Code built to solve real-world problems."
              </p>

              <div className="flex flex-wrap justify-center gap-4 mt-10">
                <a href="#contact" className="bg-sky-500 hover:bg-sky-400 text-slate-950 font-semibold px-8 py-3.5 rounded-lg transition-all shadow-lg shadow-sky-500/10 transform hover:-translate-y-0.5">
                  Initiate Project Hub
                </a>
                <a href="#portfolio" className="bg-slate-900 hover:bg-slate-800 text-slate-300 font-medium px-8 py-3.5 rounded-lg border border-white/10 transition-all transform hover:-translate-y-0.5">
                  Explore Implementations
                </a>
              </div>
            </div>
          </section>

          {/* About */}
          <section id="about" className="py-24 max-w-6xl mx-auto px-6 border-t border-white/5">
            <div className="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">
              <div>
                <span className="text-xs font-bold text-sky-400 tracking-widest uppercase">The Paradigm</span>
                <h2 className="text-3xl font-bold text-white mt-2 mb-6">Bridging Code and Advanced Inference</h2>
                <div className="space-y-4 text-slate-400 text-base leading-relaxed">
                  <p>I operate as a hybrid technologist specializing in building high-fidelity web layers while managing precise generative AI infrastructure.</p>
                  <p>My development workflow couples structural reliability with targeted interactive mechanics, ensuring user interfaces translate into optimized data flows.</p>
                </div>
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div className="p-6 bg-slate-900/50 rounded-xl border border-white/5">
                  <div className="text-3xl font-bold text-white mb-2">50+</div>
                  <div className="text-sm text-slate-400">Deployed Functional Architectures</div>
                </div>
                <div className="p-6 bg-slate-900/50 rounded-xl border border-white/5">
                  <div className="text-3xl font-bold text-white mb-2">20+</div>
                  <div className="text-sm text-slate-400">Generative Media Frameworks</div>
                </div>
              </div>
            </div>
          </section>

          {/* Projects Showcase */}
          <section id="portfolio" className="py-24 bg-[#090d16] border-t border-white/5">
            <div className="max-w-6xl mx-auto px-6">
              <div className="mb-12">
                <span className="text-xs font-bold text-sky-400 tracking-widest uppercase">Showcase</span>
                <h2 className="text-3xl font-bold text-white mt-2">Production Implementations</h2>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                {/* Card 1 */}
                <div className="bg-[#111827]/60 border border-white/5 rounded-xl p-6 flex flex-col justify-between hover:border-sky-500/30 transition-all group">
                  <div>
                    <span className="text-xs px-2.5 py-1 rounded-md bg-purple-500/10 text-purple-400 border border-purple-500/20 font-mono">Live Engine</span>
                    <h3 className="text-xl font-bold text-white mt-4 group-hover:text-sky-400 transition-colors">The Lex Vault</h3>
                    <p className="text-sm text-slate-400 mt-2">High-resolution AI media generation hub and cinematic prompt repository.</p>
                    <div className="flex flex-wrap gap-1 mt-4">
                      {["UI Design", "Advanced Prompt", "Asset Mgmt"].map(t => (
                        <span key={t} className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-300">{t}</span>
                      ))}
                    </div>
                  </div>
                  <div className="mt-6">
                    <a href="https://thelexvault.netlify.app/" target="_blank" rel="noreferrer" className="text-xs text-sky-400 font-semibold hover:underline">Analyze Architecture →</a>
                  </div>
                </div>

                {/* Card 2 */}
                <div className="bg-[#111827]/60 border border-white/5 rounded-xl p-6 flex flex-col justify-between hover:border-sky-500/30 transition-all group">
                  <div>
                    <span className="text-xs px-2.5 py-1 rounded-md bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 font-mono">Utility</span>
                    <h3 className="text-xl font-bold text-white mt-4 group-hover:text-sky-400 transition-colors">QR Cola</h3>
                    <p className="text-sm text-slate-400 mt-2">A streamlined, interactive utility platform built for quick asset access and clean digital distribution.</p>
                    <div className="flex flex-wrap gap-1 mt-4">
                      {["React", "Tailwind CSS", "Netlify"].map(t => (
                        <span key={t} className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-300">{t}</span>
                      ))}
                    </div>
                  </div>
                  <div className="mt-6">
                    <a href="https://qrcola.netlify.app/" target="_blank" rel="noreferrer" className="text-xs text-sky-400 font-semibold hover:underline">Analyze Architecture →</a>
                  </div>
                </div>

                {/* Card 3 */}
                <div className="bg-[#111827]/60 border border-white/5 rounded-xl p-6 flex flex-col justify-between hover:border-sky-500/30 transition-all group">
                  <div>
                    <span className="text-xs px-2.5 py-1 rounded-md bg-sky-500/10 text-sky-400 border border-sky-500/20 font-mono">Agri-Tech</span>
                    <h3 className="text-xl font-bold text-white mt-4 group-hover:text-sky-400 transition-colors">Ain Ali Traders & Pesticides Hub</h3>
                    <p className="text-sm text-slate-400 mt-2">Bringing commercial agriculture into the digital space—a clean business interface optimized for local accessibility in Karor Lal Esan.</p>
                    <div className="flex flex-wrap gap-1 mt-4">
                      {["React", "Python", "Responsive UI"].map(t => (
                        <span key={t} className="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-300">{t}</span>
                      ))}
                    </div>
                  </div>
                  <div className="mt-6 text-xs text-slate-500 font-mono">Internal Core Stack</div>
                </div>
              </div>
            </div>
          </section>

          {/* Social Advocacy Section */}
          <section id="advocacy" className="py-24 max-w-6xl mx-auto px-6 border-t border-white/5">
            <div className="mb-12">
              <span className="text-xs font-bold text-sky-400 tracking-widest uppercase">Advocacy & Design Engagement</span>
              <h2 className="text-3xl font-bold text-white mt-2">Social Leadership & Regional Contributions</h2>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
              <div className="p-8 bg-slate-900/40 border border-white/5 rounded-xl">
                <h3 className="text-lg font-bold text-white mb-2">Government Primary School Atlira</h3>
                <p className="text-sm text-slate-400 leading-relaxed">Showcasing digital contributions, admission posters, facility banners, and local educational seminar materials.</p>
              </div>
              <div className="p-8 bg-slate-900/40 border border-white/5 rounded-xl">
                <h3 className="text-lg font-bold text-white mb-2">Social Leadership Visuals</h3>
                <p className="text-sm text-slate-400 leading-relaxed">Highlighting professional design work for regional organizations, such as the Punjab Teachers Union leadership materials.</p>
              </div>
            </div>
          </section>

          {/* The Bench Section */}
          <section id="bench" className="py-24 bg-[#090d16] border-t border-white/5">
            <div className="max-w-6xl mx-auto px-6 text-center">
              <span className="text-xs font-bold text-sky-400 tracking-widest uppercase">The Bench</span>
              <h2 className="text-3xl font-bold text-white mt-2 mb-12">Development Setup & Inference Tooling Matrix</h2>
              <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                <div className="p-5 bg-[#111827]/40 border border-white/5 rounded-xl">
                  <h4 className="text-sm font-semibold text-slate-300 mb-2">Computation</h4>
                  <p className="text-xs text-sky-400 font-mono">Python Libraries</p>
                </div>
                <div className="p-5 bg-[#111827]/40 border border-white/5 rounded-xl">
                  <h4 className="text-sm font-semibold text-slate-300 mb-2">Client Layer</h4>
                  <p className="text-xs text-sky-400 font-mono">React Tools / Tailwind</p>
                </div>
                <div className="p-5 bg-[#111827]/40 border border-white/5 rounded-xl">
                  <h4 className="text-sm font-semibold text-slate-300 mb-2">Workflows</h4>
                  <p className="text-xs text-sky-400 font-mono">GitHub / Netlify</p>
                </div>
                <div className="p-5 bg-[#111827]/40 border border-white/5 rounded-xl">
                  <h4 className="text-sm font-semibold text-slate-300 mb-2">AI Models</h4>
                  <p className="text-xs text-sky-400 font-mono">Image & Video Gen</p>
                </div>
              </div>
            </div>
          </section>

          {/* Technical Blogs */}
          <section id="blog" className="py-24 max-w-6xl mx-auto px-6 border-t border-white/5">
            <div className="mb-12">
              <span className="text-xs font-bold text-sky-400 tracking-widest uppercase">Insights</span>
              <h2 className="text-3xl font-bold text-white mt-2">Technical Authority & Writing</h2>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
              <div className="p-6 bg-slate-900/30 rounded-xl border border-white/5">
                <span className="text-[11px] font-mono text-sky-400">Generative Pipelines</span>
                <h3 className="text-lg font-bold text-white mt-2">Mastering Visual Consistency: A Deep Dive into Cinematic Image-to-Video Workflows.</h3>
              </div>
              <div className="p-6 bg-slate-900/30 rounded-xl border border-white/5">
                <span className="text-[11px] font-mono text-sky-400">Web Optimization</span>
                <h3 className="text-lg font-bold text-white mt-2">Building for the Web in 2026: Why I Pair React with Netlify for Rapid Project Deployment.</h3>
              </div>
            </div>
          </section>

          {/* Contact Module with Guestbook Integration */}
          <section id="contact" className="py-24 bg-[#090d16] border-t border-white/5">
            <div className="max-w-6xl mx-auto px-6 grid grid-cols-1 lg:grid-cols-2 gap-12">
              
              {/* Form */}
              <div className="bg-[#111827]/40 border border-white/5 p-8 rounded-2xl backdrop-blur-xl">
                <h3 className="text-2xl font-bold text-white mb-2">Direct Communications</h3>
                <p className="text-sm text-slate-400 mb-6">Connect for custom web platforms or prompt design assets.</p>
                <form onSubmit={handleContactSubmit} className="space-y-4">
                  <input type="text" required value={contactForm.name} onChange={e => setContactForm({...contactForm, name: e.target.value})} className="w-full bg-slate-950 border border-white/10 rounded-lg p-3 text-sm text-white focus:border-sky-500 outline-none" placeholder="Your Name" />
                  <input type="email" required value={contactForm.email} onChange={e => setContactForm({...contactForm, email: e.target.value})} className="w-full bg-slate-950 border border-white/10 rounded-lg p-3 text-sm text-white focus:border-sky-500 outline-none" placeholder="Email Address" />
                  <textarea required rows="4" value={contactForm.message} onChange={e => setContactForm({...contactForm, message: e.target.value})} className="w-full bg-slate-950 border border-white/10 rounded-lg p-3 text-sm text-white focus:border-sky-500 outline-none resize-none" placeholder="Message Details..."></textarea>
                  <button type="submit" className="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold p-3 rounded-lg text-sm transition-colors">Broadcast Packet</button>
                  {formSubmitted && <p className="text-xs font-mono text-emerald-400 text-center mt-2">✔ Transmission received successfully.</p>}
                </form>
              </div>

              {/* Guestbook Component */}
              <div className="flex flex-col justify-between">
                <div className="bg-[#111827]/40 border border-white/5 p-8 rounded-2xl backdrop-blur-xl mb-6 flex-grow">
                  <h3 className="text-2xl font-bold text-white mb-1">The Guestbook</h3>
                  <p className="text-sm text-slate-400 mb-6">A clean, glassmorphic registry for client networks.</p>
                  <form onSubmit={handleGuestbookSubmit} className="flex gap-2 mb-6">
                    <input type="text" required value={gbName} onChange={e => setGbName(e.target.value)} placeholder="Handle" className="w-1/3 bg-slate-950 border border-white/10 rounded-lg px-3 py-2 text-xs text-white" />
                    <input type="text" required value={gbMessage} onChange={e => setGbMessage(e.target.value)} placeholder="Sign the guestbook..." className="w-2/3 bg-slate-950 border border-white/10 rounded-lg px-3 py-2 text-xs text-white" />
                    <button type="submit" className="bg-slate-800 hover:bg-slate-700 text-sky-400 font-mono text-xs px-3 rounded-lg border border-white/10">Sign</button>
                  </form>
                  <div className="space-y-3 max-h-[200px] overflow-y-auto pr-2 custom-scrollbar">
                    {guestbook.map((entry, idx) => (
                      <div key={idx} className="bg-slate-950/60 p-3 rounded-lg border border-white/5 text-xs">
                        <div className="flex justify-between text-[11px] font-mono text-slate-500 mb-1">
                          <span className="text-sky-400/80 font-semibold">@{entry.name}</span>
                          <span>{entry.date}</span>
                        </div>
                        <p className="text-slate-300">{entry.msg}</p>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Footer Social System Links */}
                <div className="grid grid-cols-4 gap-2 text-center text-xs font-mono">
                  <a href="https://github.com/ainali550-cell" target="_blank" rel="noreferrer" className="p-3 bg-slate-900 border border-white/5 rounded-lg text-slate-300">GitHub</a>
                  <a href="https://wa.me/923029112840" target="_blank" rel="noreferrer" className="p-3 bg-slate-900 border border-white/5 rounded-lg text-emerald-400">WhatsApp</a>
                  <a href="https://www.instagram.com/shakoormalik39" target="_blank" rel="noreferrer" className="p-3 bg-slate-900 border border-white/5 rounded-lg text-pink-400">Instagram</a>
                  <a href="https://www.facebook.com/share/1CiuBmy4NZ/?mibextid=wwXIfr" target="_blank" rel="noreferrer" className="p-3 bg-slate-900 border border-white/5 rounded-lg text-blue-400">Facebook</a>
                </div>
              </div>

            </div>
          </section>

          <footer className="bg-slate-950 border-t border-white/5 py-8 text-center text-xs font-mono text-slate-500">
            <p>© 2026 Shakoor Malik. All rights reserved.</p>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    </script>
</body>
</html>
