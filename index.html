<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Shakoor Malik | AI Workflow & Web Engineering Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
    <script>
      // Suppress Tailwind CDN production warning
      window.__TAILWIND_SUPPRESS_CDN_WARNING = true;
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      // Suppress Babel standalone development warning
      if (window.Babel) { Babel.disableScriptTags = false; }
      const _warn = console.warn.bind(console);
      console.warn = (...args) => {
        const msg = args[0] || '';
        if (
          (typeof msg === 'string' && (
            msg.includes('Babel') ||
            msg.includes('@babel/standalone') ||
            msg.includes('CDN') ||
            msg.includes('production build') ||
            msg.includes('tailwindcss')
          ))
        ) return;
        _warn(...args);
      };
    </script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Space Grotesk"', 'sans-serif'],
              mono: ['"Space Mono"', 'monospace'],
              serif: ['"Cormorant Garamond"', 'serif'],
            }
          }
        }
      }

    <style>
        :root {
          --accent: #38bdf8;
          --accent2: #818cf8;
          --bg: #070b14;
          --surface: #0d1424;
          --surface2: #111827;
          --border: rgba(255,255,255,0.06);
        }
        html { scroll-behavior: smooth; background-color: var(--bg); }
        * { box-sizing: border-box; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.01); }
        ::-webkit-scrollbar-thumb { background: rgba(56,189,248,0.2); border-radius: 99px; }

        /* Grid bg */
        .grid-bg {
          background-image: linear-gradient(rgba(56,189,248,0.03) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(56,189,248,0.03) 1px, transparent 1px);
          background-size: 60px 60px;
        }

        /* Glow */
        .glow-sky { box-shadow: 0 0 30px rgba(56,189,248,0.08), 0 0 60px rgba(56,189,248,0.04); }
        .glow-indigo { box-shadow: 0 0 30px rgba(129,140,248,0.08); }

        /* Scan line animation */
        @keyframes scanline {
          0% { transform: translateY(-100%); }
          100% { transform: translateY(100vh); }
        }
        .scanline {
          position: fixed; top: 0; left: 0; right: 0; height: 2px;
          background: linear-gradient(transparent, rgba(56,189,248,0.06), transparent);
          animation: scanline 8s linear infinite;
          pointer-events: none; z-index: 1;
        }

        /* Fade up */
        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .fade-up { animation: fadeUp 0.6s ease forwards; }
        .fade-up-1 { animation-delay: 0.1s; opacity: 0; }
        .fade-up-2 { animation-delay: 0.25s; opacity: 0; }
        .fade-up-3 { animation-delay: 0.4s; opacity: 0; }
        .fade-up-4 { animation-delay: 0.55s; opacity: 0; }

        /* Blink cursor */
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
        .cursor { animation: blink 1s step-end infinite; }

        /* Skill bar */
        @keyframes fillBar {
          from { width: 0; }
          to { width: var(--pct); }
        }
        .skill-bar-fill { animation: fillBar 1.2s ease forwards; animation-delay: 0.3s; }

        /* Hover card lift */
        .card-lift { transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease; }
        .card-lift:hover { transform: translateY(-4px); border-color: rgba(56,189,248,0.3); box-shadow: 0 12px 40px rgba(56,189,248,0.07); }

        /* Nav link underline */
        .nav-link { position: relative; }
        .nav-link::after { content:''; position:absolute; bottom:-2px; left:0; right:0; height:1px; background: var(--accent); transform:scaleX(0); transition:transform 0.2s ease; }
        .nav-link:hover::after { transform:scaleX(1); }

        /* Terminal block */
        .terminal { background: #050810; border: 1px solid rgba(56,189,248,0.12); border-radius:12px; }
        .terminal-bar { background: #0d1527; border-radius:10px 10px 0 0; padding:10px 14px; display:flex; align-items:center; gap:6px; border-bottom:1px solid rgba(56,189,248,0.08); }
        .dot { width:10px;height:10px;border-radius:50%; }

        /* Numbered section accent */
        .section-num { font-family: 'Space Mono', monospace; font-size:11px; color:var(--accent); letter-spacing:0.12em; }

        /* Badge */
        .badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:6px; font-size:11px; font-family:'Space Mono',monospace; border:1px solid; transition:all 0.2s ease; }
        .badge:hover { transform:scale(1.04); }

        /* Timeline */
        .timeline-line { position:absolute; left:0; top:8px; bottom:0; width:1px; background:linear-gradient(to bottom, rgba(56,189,248,0.4), transparent); }
        .timeline-dot { width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(56,189,248,0.6); flex-shrink:0; margin-top:5px; }

        /* Profile avatar */
        .avatar-ring { 
          width:140px;height:140px;border-radius:50%;
          background:linear-gradient(135deg,rgba(56,189,248,0.2),rgba(129,140,248,0.2));
          border:2px solid rgba(56,189,248,0.3);
          display:flex;align-items:center;justify-content:center;
          position:relative; flex-shrink:0;
        }
        .avatar-ring::before {
          content:''; position:absolute; inset:-4px; border-radius:50%;
          border:1px solid rgba(56,189,248,0.1);
        }
        .avatar-initials { font-size:42px; font-weight:700; font-family:'Space Mono',monospace; background:linear-gradient(135deg,#38bdf8,#818cf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
        .avatar-photo { width:100%; height:100%; border-radius:50%; object-fit:cover; object-position:center 15%; filter: drop-shadow(0 0 18px rgba(56,189,248,0.25)) saturate(1.08); }

        /* Stat pulse */
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
        .online-dot { width:6px;height:6px;border-radius:50%;background:#34d399;animation:pulse 2s ease infinite; flex-shrink:0; }

        /* Project num */
        .proj-num { font-size:64px;font-weight:700;font-family:'Space Mono',monospace;color:rgba(255,255,255,0.04);line-height:1;position:absolute;top:-10px;right:16px; pointer-events:none; }

        /* Mobile nav */
        .mob-menu { display:none; }
        @media(max-width:768px) {
          .mob-menu { display:flex; }
          .desk-nav { display:none; }
          .proj-num { font-size:40px; }
        }

        /* Glassmorphism panels */
        .glass { background:rgba(13,20,36,0.6); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }

        /* Section divider */
        .section-divider { height:1px; background:linear-gradient(to right, transparent, rgba(56,189,248,0.15), transparent); }

        /* Cinematic fixed video background */
        .bg-video-layer {
          position: fixed; inset: 0; width: 100vw; height: 100vh;
          z-index: 0; overflow: hidden; background: #050810;
          pointer-events: none;
        }
        .bg-video-layer video {
          position: absolute; top: 50%; left: 50%;
          min-width: 100%; min-height: 100%; width: auto; height: auto;
          transform: translate(-50%, -50%);
          object-fit: cover;
          filter: brightness(0.42) saturate(1.15) contrast(1.08);
        }
        /* Cinematic letterbox bars */
        .bg-video-layer .letterbox-top,
        .bg-video-layer .letterbox-bottom {
          position: absolute; left: 0; right: 0; height: 6.5vh; background: #000;
          z-index: 3;
        }
        .bg-video-layer .letterbox-top { top: 0; }
        .bg-video-layer .letterbox-bottom { bottom: 0; }
        /* Vignette + color wash to keep text legible over any frame */
        .bg-video-layer .vignette {
          position: absolute; inset: 0; z-index: 2;
          background:
            radial-gradient(ellipse at center, transparent 30%, rgba(5,8,16,0.55) 100%),
            linear-gradient(rgba(7,11,20,0.55), rgba(7,11,20,0.75));
        }
        /* Ensure app content always sits above the fixed video */
        #root { position: relative; z-index: 1; }

    </style>
</head>

    /* ─── TYPEWRITER ─── */
    function Typewriter({ words }) {
      const [wi, setWi] = useState(0);
      const [ci, setCi] = useState(0);
      const [del, setDel] = useState(false);
      const [text, setText] = useState('');
      useEffect(() => {
        const word = words[wi];
        let speed = del ? 40 : 90;
        if (!del && ci === word.length) { speed = 2200; setDel(true); }
        else if (del && ci === 0) { setDel(false); setWi(p => (p + 1) % words.length); speed = 400; }
        const t = setTimeout(() => {
          if (del) { setText(word.substring(0, ci - 1)); setCi(p => p - 1); }
          else { setText(word.substring(0, ci + 1)); setCi(p => p + 1); }
        }, speed);
        return () => clearTimeout(t);
      }, [ci, del, wi]);
      return (
        <span className="text-sky-400 font-mono">
          {text}<span className="cursor text-sky-300">|</span>
        </span>
      );
    }

    /* ─── SKILL BAR ─── */
    function SkillBar({ name, pct, color = '#38bdf8' }) {
      return (

          <div className="flex justify-between text-xs font-mono mb-1">
            <span className="text-slate-300">{name}</span>
            <span style={{color}} className="opacity-70">{pct}%</span>
          </div>
          <div className="h-[3px] bg-white/5 rounded-full overflow-hidden">
            <div
              className="h-full rounded-full skill-bar-fill"
              style={{'--pct': pct + '%', background: `linear-gradient(to right, ${color}99, ${color})`, width: '0%'}}
            />
          </div>
        </div>
      );
    }

    /* ─── BADGE ─── */
    function Badge({ label, color = 'sky' }) {
      const colors = {
        sky:    { bg: 'rgba(56,189,248,0.08)',  border: 'rgba(56,189,248,0.25)',  text: '#7dd3fc' },
        indigo: { bg: 'rgba(129,140,248,0.08)', border: 'rgba(129,140,248,0.25)', text: '#a5b4fc' },
        emerald:{ bg: 'rgba(52,211,153,0.08)',  border: 'rgba(52,211,153,0.25)',  text: '#6ee7b7' },
        purple: { bg: 'rgba(192,132,252,0.08)', border: 'rgba(192,132,252,0.25)', text: '#d8b4fe' },
        amber:  { bg: 'rgba(251,191,36,0.08)',  border: 'rgba(251,191,36,0.25)',  text: '#fcd34d' },
        rose:   { bg: 'rgba(251,113,133,0.08)', border: 'rgba(251,113,133,0.25)', text: '#fda4af' },
      };
      const c = colors[color] || colors.sky;
      return (
        <span className="badge" style={{background: c.bg, borderColor: c.border, color: c.text}}>
          {label}
        </span>
      );
    }

              <div className="terminal rounded-2xl p-8">
                <div className="terminal-bar mb-6 -mx-8 -mt-8 px-6 py-3 rounded-t-2xl">
                  <span className="dot bg-red-500/70"></span>
                  <span className="dot bg-yellow-500/70"></span>
                  <span className="dot bg-green-500/70"></span>
                  <span className="font-mono text-[10px] text-slate-500 ml-2">contact.sh</span>
                </div>
                <h3 className="text-lg font-bold text-white mb-1">Direct Communications</h3>
                <p className="text-xs font-mono text-slate-500 mb-6">// Connect for custom web platforms or prompt design assets</p>
                <form onSubmit={handleContact} className="space-y-4">
                  <div>
                    <label className="font-mono text-[10px] text-slate-500 uppercase tracking-wider block mb-1.5">Name</label>
                    <input type="text" required value={contactForm.name}
                      onChange={e => setContactForm({...contactForm, name: e.target.value})}
                      className="w-full bg-white/3 border border-white/8 rounded-lg p-3 text-sm text-white focus:border-sky-500/50 focus:outline-none font-mono transition-colors" placeholder="Your name" />
                  </div>
                  <div>
                    <label className="font-mono text-[10px] text-slate-500 uppercase tracking-wider block mb-1.5">Email</label>
                    <input type="email" required value={contactForm.email}
                      onChange={e => setContactForm({...contactForm, email: e.target.value})}
                      className="w-full bg-white/3 border border-white/8 rounded-lg p-3 text-sm text-white focus:border-sky-500/50 focus:outline-none font-mono transition-colors" placeholder="your@email.com" />
                  </div>
                  <div>
                    <label className="font-mono text-[10px] text-slate-500 uppercase tracking-wider block mb-1.5">Message</label>
                    <textarea required rows="4" value={contactForm.message}
                      onChange={e => setContactForm({...contactForm, message: e.target.value})}
                      className="w-full bg-white/3 border border-white/8 rounded-lg p-3 text-sm text-white focus:border-sky-500/50 focus:outline-none font-mono resize-none transition-colors" placeholder="Tell me about your project..."></textarea>
                  </div>
                  <button type="submit"
                    className="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold p-3 rounded-lg text-sm transition-colors font-mono">
                    {submitted ? '✔ Message Sent!' : '$ send_message →'}
                  </button>
                  {submitted && <p className="text-xs font-mono text-emerald-400 text-center">Transmission received. I'll respond within 24h.</p>}
                </form>
              </div>

              {/* Right column */}
              <div className="flex flex-col gap-6">
                {/* Social links */}
                <div className="terminal rounded-2xl p-6">
                  <h3 className="font-mono text-xs text-slate-500 uppercase tracking-widest mb-4">// Reach out directly</h3>
                  <div className="grid grid-cols-2 gap-3">
                    {[
                      { label: 'GitHub', href: 'https://github.com/ainali550-cell', color: 'border-white/10 text-slate-300' },
                      { label: 'WhatsApp', href: 'https://wa.me/923029112840', color: 'border-emerald-500/20 text-emerald-400' },
                      { label: 'Instagram', href: 'https://www.instagram.com/shakoormalik39', color: 'border-pink-500/20 text-pink-400' },
                      { label: 'Facebook', href: 'https://www.facebook.com/share/1CiuBmy4NZ/?mibextid=wwXIfr', color: 'border-blue-500/20 text-blue-400' },
                    ].map(s => (
                      <a key={s.label} href={s.href} target="_blank" rel="noreferrer"
                        className={`flex items-center justify-center gap-2 p-3 bg-white/3 border ${s.color} rounded-xl font-mono text-sm hover:bg-white/6 transition-all hover:-translate-y-0.5`}>
                        {s.label}
                      </a>
                    ))}
                  </div>
                </div>

                {/* Guestbook */}
                <div className="terminal rounded-2xl p-6 flex-grow">
                  <h3 className="font-bold text-white mb-1">The Guestbook</h3>
                  <p className="font-mono text-[10px] text-slate-500 mb-5">// Sign and leave your mark</p>
                  <form onSubmit={handleGuestbook} className="flex gap-2 mb-5">
                    <input type="text" required value={gbName} onChange={e => setGbName(e.target.value)}
                      placeholder="Handle" className="w-1/3 bg-white/3 border border-white/8 rounded-lg px-3 py-2 text-xs text-white font-mono focus:outline-none focus:border-sky-500/40" />
                    <input type="text" required value={gbMsg} onChange={e => setGbMsg(e.target.value)}
                      placeholder="Leave a message..." className="flex-1 bg-white/3 border border-white/8 rounded-lg px-3 py-2 text-xs text-white font-mono focus:outline-none focus:border-sky-500/40" />
                    <button type="submit" className="bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 font-mono text-xs px-3 rounded-lg border border-sky-500/20 transition-colors">Sign</button>
                  </form>
                  <div className="space-y-2 max-h-[180px] overflow-y-auto pr-1">
                    {guestbook.map((e, i) => (
                      <div key={i} className="bg-white/2 p-3 rounded-lg border border-white/4">
                        <div className="flex justify-between font-mono text-[10px] mb-1">
                          <span className="text-sky-400">@{e.name}</span>
                          <span className="text-slate-600">{e.date}</span>
                        </div>
                        <p className="text-xs text-slate-400">{e.msg}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* ── FOOTER ── */}
          <footer className="border-t border-white/5 py-8 bg-[#050810]/70 backdrop-blur-[2px]">
            <div className="max-w-6xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-2">
                <span className="font-mono text-xs text-sky-400/60">{'<'}</span>
                <span className="text-sm font-bold bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">SM</span>
                <span className="font-mono text-xs text-sky-400/60">{'/>'}</span>
              </div>
              <p className="font-mono text-[11px] text-slate-600">© 2026 Shakoor Malik · Pakistan 🇵🇰 · All rights reserved.</p>
              <div className="flex items-center gap-1">
                <span className="online-dot"></span>
                <span className="font-mono text-[10px] text-emerald-400/60">Available for hire</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    </script>
</body>
</html>
