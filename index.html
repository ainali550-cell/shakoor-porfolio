<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
    <script>
      // Suppress Tailwind CDN production warning
      window.__TAILWIND_SUPPRESS_CDN_WARNING = true;
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script>
      // Suppress Babel standalone development warning
      if (window.Babel) { Babel.disableScriptTags = false; }
      const _warn = console.warn.bind(console);
      console.warn = (...args) => {
        const msg = args[0] || '';
        if (
          (typeof msg === 'string' && (
            msg.includes('Babel') ||
            msg.includes('@babel/standalone') ||
            msg.includes('CDN') ||
            msg.includes('production build') ||
            msg.includes('tailwindcss')
          ))
        ) return;
        _warn(...args);
      };
    </script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Space Grotesk"', 'sans-serif'],
              mono: ['"Space Mono"', 'monospace'],
              serif: ['"Cormorant Garamond"', 'serif'],
            }
          }
        }
      }
    </script>
    <style>
        :root {
          --accent: #38bdf8;
          --accent2: #818cf8;
          --bg: #070b14;
          --surface: #0d1424;
          --surface2: #111827;
          --border: rgba(255,255,255,0.06);
        }
        html { scroll-behavior: smooth; background-color: var(--bg); }
        * { box-sizing: border-box; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.01); }
        ::-webkit-scrollbar-thumb { background: rgba(56,189,248,0.2); border-radius: 99px; }

        /* Grid bg */
        .grid-bg {
          background-image: linear-gradient(rgba(56,189,248,0.03) 1px, transparent 1px),
                            linear-gradient(90deg, rgba(56,189,248,0.03) 1px, transparent 1px);
          background-size: 60px 60px;
        }

        /* Glow */
        .glow-sky { box-shadow: 0 0 30px rgba(56,189,248,0.08), 0 0 60px rgba(56,189,248,0.04); }
        .glow-indigo { box-shadow: 0 0 30px rgba(129,140,248,0.08); }

        /* Scan line animation */
        @keyframes scanline {
          0% { transform: translateY(-100%); }
          100% { transform: translateY(100vh); }
        }
        .scanline {
          position: fixed; top: 0; left: 0; right: 0; height: 2px;
          background: linear-gradient(transparent, rgba(56,189,248,0.06), transparent);
          animation: scanline 8s linear infinite;
          pointer-events: none; z-index: 1;
        }

        /* Fade up */
        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(20px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .fade-up { animation: fadeUp 0.6s ease forwards; }
        .fade-up-1 { animation-delay: 0.1s; opacity: 0; }
        .fade-up-2 { animation-delay: 0.25s; opacity: 0; }
        .fade-up-3 { animation-delay: 0.4s; opacity: 0; }
        .fade-up-4 { animation-delay: 0.55s; opacity: 0; }

        /* Blink cursor */
        @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
        .cursor { animation: blink 1s step-end infinite; }

        /* Skill bar */
        @keyframes fillBar {
          from { width: 0; }
          to { width: var(--pct); }
        }
        .skill-bar-fill { animation: fillBar 1.2s ease forwards; animation-delay: 0.3s; }

        /* Hover card lift */
        .card-lift { transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease; }
        .card-lift:hover { transform: translateY(-4px); border-color: rgba(56,189,248,0.3); box-shadow: 0 12px 40px rgba(56,189,248,0.07); }

        /* Nav link underline */
        .nav-link { position: relative; }
        .nav-link::after { content:''; position:absolute; bottom:-2px; left:0; right:0; height:1px; background: var(--accent); transform:scaleX(0); transition:transform 0.2s ease; }
        .nav-link:hover::after { transform:scaleX(1); }

        /* Terminal block */
        .terminal { background: #050810; border: 1px solid rgba(56,189,248,0.12); border-radius:12px; }
        .terminal-bar { background: #0d1527; border-radius:10px 10px 0 0; padding:10px 14px; display:flex; align-items:center; gap:6px; border-bottom:1px solid rgba(56,189,248,0.08); }
        .dot { width:10px;height:10px;border-radius:50%; }

        /* Numbered section accent */
        .section-num { font-family: 'Space Mono', monospace; font-size:11px; color:var(--accent); letter-spacing:0.12em; }

        /* Badge */
        .badge { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:6px; font-size:11px; font-family:'Space Mono',monospace; border:1px solid; transition:all 0.2s ease; }
        .badge:hover { transform:scale(1.04); }

        /* Timeline */
        .timeline-line { position:absolute; left:0; top:8px; bottom:0; width:1px; background:linear-gradient(to bottom, rgba(56,189,248,0.4), transparent); }
        .timeline-dot { width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px rgba(56,189,248,0.6); flex-shrink:0; margin-top:5px; }

        /* Profile avatar */
        .avatar-ring { 
          width:140px;height:140px;border-radius:50%;
          background:linear-gradient(135deg,rgba(56,189,248,0.2),rgba(129,140,248,0.2));
          border:2px solid rgba(56,189,248,0.3);
          display:flex;align-items:center;justify-content:center;
          position:relative; flex-shrink:0;
        }
        .avatar-ring::before {
          content:''; position:absolute; inset:-4px; border-radius:50%;
          border:1px solid rgba(56,189,248,0.1);
        }
        .avatar-initials { font-size:42px; font-weight:700; font-family:'Space Mono',monospace; background:linear-gradient(135deg,#38bdf8,#818cf8); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }

        /* Stat pulse */
        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.6} }
        .online-dot { width:6px;height:6px;border-radius:50%;background:#34d399;animation:pulse 2s ease infinite; flex-shrink:0; }

        /* Project num */
        .proj-num { font-size:64px;font-weight:700;font-family:'Space Mono',monospace;color:rgba(255,255,255,0.04);line-height:1;position:absolute;top:-10px;right:16px; pointer-events:none; }

        /* Mobile nav */
        .mob-menu { display:none; }
        @media(max-width:768px) {
          .mob-menu { display:flex; }
          .desk-nav { display:none; }
          .proj-num { font-size:40px; }
        }

        /* Glassmorphism panels */
        .glass { background:rgba(13,20,36,0.6); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }

        /* Section divider */
        .section-divider { height:1px; background:linear-gradient(to right, transparent, rgba(56,189,248,0.15), transparent); }
    </style>
</head>
<body class="bg-[#070b14] text-slate-100 min-h-screen font-sans selection:bg-sky-500/30 selection:text-sky-200">
    <div class="scanline"></div>
    <div id="root"></div>

    <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    /* ─── TYPEWRITER ─── */
    function Typewriter({ words }) {
      const [wi, setWi] = useState(0);
      const [ci, setCi] = useState(0);
      const [del, setDel] = useState(false);
      const [text, setText] = useState('');
      useEffect(() => {
        const word = words[wi];
        let speed = del ? 40 : 90;
        if (!del && ci === word.length) { speed = 2200; setDel(true); }
        else if (del && ci === 0) { setDel(false); setWi(p => (p + 1) % words.length); speed = 400; }
        const t = setTimeout(() => {
          if (del) { setText(word.substring(0, ci - 1)); setCi(p => p - 1); }
          else { setText(word.substring(0, ci + 1)); setCi(p => p + 1); }
        }, speed);
        return () => clearTimeout(t);
      }, [ci, del, wi]);
      return (
        <span className="text-sky-400 font-mono">
          {text}<span className="cursor text-sky-300">|</span>
        </span>
      );
    }

    /* ─── SKILL BAR ─── */
    function SkillBar({ name, pct, color = '#38bdf8' }) {
      return (
        <div className="mb-3">
          <div className="flex justify-between text-xs font-mono mb-1">
            <span className="text-slate-300">{name}</span>
            <span style={{color}} className="opacity-70">{pct}%</span>
          </div>
          <div className="h-[3px] bg-white/5 rounded-full overflow-hidden">
            <div
              className="h-full rounded-full skill-bar-fill"
              style={{'--pct': pct + '%', background: `linear-gradient(to right, ${color}99, ${color})`, width: '0%'}}
            />
          </div>
        </div>
      );
    }

    /* ─── BADGE ─── */
    function Badge({ label, color = 'sky' }) {
      const colors = {
        sky:    { bg: 'rgba(56,189,248,0.08)',  border: 'rgba(56,189,248,0.25)',  text: '#7dd3fc' },
        indigo: { bg: 'rgba(129,140,248,0.08)', border: 'rgba(129,140,248,0.25)', text: '#a5b4fc' },
        emerald:{ bg: 'rgba(52,211,153,0.08)',  border: 'rgba(52,211,153,0.25)',  text: '#6ee7b7' },
        purple: { bg: 'rgba(192,132,252,0.08)', border: 'rgba(192,132,252,0.25)', text: '#d8b4fe' },
        amber:  { bg: 'rgba(251,191,36,0.08)',  border: 'rgba(251,191,36,0.25)',  text: '#fcd34d' },
        rose:   { bg: 'rgba(251,113,133,0.08)', border: 'rgba(251,113,133,0.25)', text: '#fda4af' },
      };
      const c = colors[color] || colors.sky;
      return (
        <span className="badge" style={{background: c.bg, borderColor: c.border, color: c.text}}>
          {label}
        </span>
      );
    }

      const [contactForm, setContactForm] = useState({ name:'', email:'', message:'' });
      const [submitted, setSubmitted] = useState(false);

      // Nav active tracking
      useEffect(() => {
        const handler = () => {
          const sections = ['home','about','portfolio','advocacy','bench','blog','contact'];
          for (const id of sections.reverse()) {
            const el = document.getElementById(id);
            if (el && window.scrollY >= el.offsetTop - 120) { setActiveSection(id); break; }

        window.addEventListener('scroll', handler);
        return () => window.removeEventListener('scroll', handler);

                    linkText: 'View Live →',
                    detail: 'React · Tailwind CSS · Netlify',
                  },
                  {
                    num: '02',
                    badge: 'Utility',
                    badgeColor: 'emerald',
                    name: 'QR Cola',
                    desc: 'A streamlined, interactive utility platform built for quick asset access and clean digital distribution. Optimised for performance.',
                    tags: ['React', 'Tailwind CSS', 'Netlify', 'QR Engine'],
                    link: 'https://qrcola.netlify.app/',
                    linkText: 'View Live →',
                    detail: 'React · Netlify CI/CD',
                  },
                  {
                    num: '03',
                    badge: 'Agri-Tech',
                    badgeColor: 'sky',
                    name: 'Ain Ali Traders & Pesticides Hub',
                    desc: 'Bringing commercial agriculture into the digital space — a clean business interface optimised for local accessibility in Karor Lal Esan.',
                    tags: ['React', 'Python', 'Responsive UI', 'Local SEO'],
                    link: null,
                    linkText: 'Internal Stack',
                    detail: 'React · Python · Responsive UI',
                  },
                ].map(p => (
                  <div key={p.num} className="card-lift relative border border-white/5 rounded-2xl p-8 bg-[#0d1424]/60 overflow-hidden group">
                    <span className="proj-num">{p.num}</span>
                    <div className="relative z-10 grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
                      <div className="md:col-span-2">
                        <div className="flex items-center gap-3 mb-3">
                          <Badge label={p.badge} color={p.badgeColor} />
                          <span className="font-mono text-[10px] text-slate-600">// {p.detail}</span>
                        </div>
                        <h3 className="text-xl font-bold text-white mb-2 group-hover:text-sky-400 transition-colors">{p.name}</h3>
                        <p className="text-sm text-slate-400 leading-relaxed mb-4">{p.desc}</p>
                        <div className="flex flex-wrap gap-2">
                          {p.tags.map(t => <span key={t} className="font-mono text-[10px] px-2.5 py-1 rounded-md bg-white/4 text-slate-400 border border-white/5">{t}</span>)}
                        </div>
                      </div>
                      <div className="flex md:justify-end items-start">
                        {p.link ? (
                          <a href={p.link} target="_blank" rel="noreferrer"
                            className="inline-flex items-center gap-2 text-sm font-mono text-sky-400 hover:text-sky-300 border border-sky-500/20 hover:border-sky-500/40 px-5 py-2.5 rounded-lg bg-sky-500/5 hover:bg-sky-500/10 transition-all">
                            {p.linkText}
                          </a>
                        ) : (
                          <span className="inline-flex items-center gap-2 text-sm font-mono text-slate-500 border border-white/5 px-5 py-2.5 rounded-lg">
                            {p.linkText}
                          </span>
                        )}
                      </div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          <div className="section-divider" />

          {/* ── SKILLS ── */}
          <section id="skills" className="py-24 max-w-6xl mx-auto px-6">
            <span className="section-num">03 // SKILLS</span>
            <h2 className="text-3xl font-bold text-white mt-3 mb-12">Technical Skill Matrix</h2>

            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

              {/* AI & Prompt */}
              <div className="card-lift border border-white/5 rounded-2xl p-6 bg-[#0d1424]/60">
                <div className="flex items-center gap-2 mb-5">
                  <span className="w-2 h-2 rounded-full bg-sky-400 shadow-[0_0_6px_#38bdf8]"></span>
                  <h3 className="font-mono text-xs text-sky-400 uppercase tracking-widest">AI & Prompt Engineering</h3>
                </div>
                <div className="mb-5">
                  {[
                    { name: 'Prompt Engineering', pct: 95 },
                    { name: 'AI Image Generation', pct: 92 },
                    { name: 'AI Video Generation', pct: 90 },
                    { name: 'AI Song / Audio Gen', pct: 85 },
                    { name: 'AI Workflow Design', pct: 85 },
                  ].map(s => <SkillBar key={s.name} {...s} color="#38bdf8" />)}
                </div>
                <div className="flex flex-wrap gap-1.5 pt-3 border-t border-white/5">
                  {['Midjourney','Runway','Suno AI','ComfyUI','Claude','GPT-4','Kling'].map(b => <Badge key={b} label={b} color="sky" />)}
                </div>
              </div>

              {/* Video Production */}
              <div className="card-lift border border-white/5 rounded-2xl p-6 bg-[#0d1424]/60">
                <div className="flex items-center gap-2 mb-5">
                  <span className="w-2 h-2 rounded-full bg-rose-400 shadow-[0_0_6px_#fb7185]"></span>
                  <h3 className="font-mono text-xs text-rose-400 uppercase tracking-widest">Video Production</h3>
                </div>
                <div className="mb-5">
                  {[
                    { name: 'Professional Video Editing', pct: 92 },
                    { name: 'Animated / Cartoon Video', pct: 88 },
                    { name: 'YouTube All Categories', pct: 90 },
                    { name: 'Social Media Videos', pct: 93 },
                    { name: 'ECCE Child Content', pct: 88 },
                  ].map(s => <SkillBar key={s.name} {...s} color="#fb7185" />)}
                </div>
                <div className="flex flex-wrap gap-1.5 pt-3 border-t border-white/5">
                  {['CapCut','Premiere Pro','After Effects','Canva Video','HeyGen','Pictory'].map(b => <Badge key={b} label={b} color="rose" />)}
                </div>
              </div>

              {/* Physics & Maths */}
              <div className="card-lift border border-white/5 rounded-2xl p-6 bg-[#0d1424]/60">
                <div className="flex items-center gap-2 mb-5">
                  <span className="w-2 h-2 rounded-full bg-amber-400 shadow-[0_0_6px_#fbbf24]"></span>
                  <h3 className="font-mono text-xs text-amber-400 uppercase tracking-widest">Physics & Mathematics</h3>
                </div>
                <div className="mb-5">
                  {[
                    { name: 'Physics (Metric → Master)', pct: 95 },
                    { name: 'Mathematics (All Levels)', pct: 93 },
                    { name: 'Problem Solving', pct: 96 },
                    { name: 'Scientific Writing', pct: 85 },
                    { name: 'Lab & Experiment Design', pct: 82 },
                  ].map(s => <SkillBar key={s.name} {...s} color="#fbbf24" />)}
                </div>
                <div className="flex flex-wrap gap-1.5 pt-3 border-t border-white/5">
                  {['Metric','Intermediate','Bachelor','Master','Olympiad'].map(b => <Badge key={b} label={b} color="amber" />)}
                </div>
              </div>

              {/* Teaching */}
              <div className="card-lift border border-white/5 rounded-2xl p-6 bg-[#0d1424]/60">
                <div className="flex items-center gap-2 mb-5">
                  <span className="w-2 h-2 rounded-full bg-emerald-400 shadow-[0_0_6px_#34d399]"></span>
                  <h3 className="font-mono text-xs text-emerald-400 uppercase tracking-widest">Teaching & Education</h3>
                </div>
                <div className="mb-5">
                  {[
                    { name: 'Classroom Teaching', pct: 97 },
                    { name: 'Curriculum Design', pct: 88 },
                    { name: 'ECCE (Early Childhood)', pct: 90 },
                    { name: 'Urdu / English Content', pct: 92 },
                    { name: 'Digital Teaching Tools', pct: 85 },
                  ].map(s => <SkillBar key={s.name} {...s} color="#34d399" />)}
                </div>
                <div className="flex flex-wrap gap-1.5 pt-3 border-t border-white/5">
                  {['9 Yrs Govt Sector','Physics','Maths','ECCE','Urdu Poems','English Stories'].map(b => <Badge key={b} label={b} color="emerald" />)}
                </div>
              </div>

              {/* Frontend */}
              <div className="card-lift border border-white/5 rounded-2xl p-6 bg-[#0d1424]/60">
                <div className="flex items-center gap-2 mb-5">
                  <span className="w-2 h-2 rounded-full bg-indigo-400 shadow-[0_0_6px_#818cf8]"></span>
                  <h3 className="font-mono text-xs text-indigo-400 uppercase tracking-widest">Frontend Development</h3>
                </div>
                <div className="mb-5">
                  {[
                    { name: 'React / JSX', pct: 88 },
                    { name: 'Tailwind CSS', pct: 92 },
                    { name: 'HTML / CSS', pct: 95 },
                    { name: 'JavaScript', pct: 80 },
                  ].map(s => <SkillBar key={s.name} {...s} color="#818cf8" />)}
                </div>
                <div className="flex flex-wrap gap-1.5 pt-3 border-t border-white/5">
                  {['React','Tailwind','HTML5','CSS3','JS','Netlify'].map(b => <Badge key={b} label={b} color="indigo" />)}
                </div>
              </div>

              {/* Design */}
              <div className="card-lift border border-white/5 rounded-2xl p-6 bg-[#0d1424]/60">
                <div className="flex items-center gap-2 mb-5">
                  <span className="w-2 h-2 rounded-full bg-purple-400 shadow-[0_0_6px_#c084fc]"></span>
                  <h3 className="font-mono text-xs text-purple-400 uppercase tracking-widest">Design & Visual</h3>
                </div>
                <div className="mb-5">
                  {[
                    { name: 'UI/UX Design', pct: 90 },
                    { name: 'Print & Poster Design', pct: 88 },
                    { name: 'Brand Identity', pct: 82 },
                    { name: 'Motion Graphics', pct: 78 },
                  ].map(s => <SkillBar key={s.name} {...s} color="#c084fc" />)}
                </div>
                <div className="flex flex-wrap gap-1.5 pt-3 border-t border-white/5">
                  {['Figma','Photoshop','Canva','CapCut','After Effects'].map(b => <Badge key={b} label={b} color="purple" />)}
                </div>
              </div>

            </div>
          </section>

          <div className="section-divider" />

          {/* ── ADVOCACY ── */}
          <section id="advocacy" className="py-24 bg-[#050810]">
            <div className="max-w-6xl mx-auto px-6">
              <span className="section-num">04 // IMPACT</span>
              <h2 className="text-3xl font-bold text-white mt-3 mb-12">Social Leadership & Regional Contributions</h2>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {[
                  {
                    title: 'Government Primary School Atlira',
                    desc: 'Showcasing digital contributions, admission posters, facility banners, and local educational seminar materials — bringing modern design to public education.',
                    tags: ['Print Design','Education','Community'],
                    color: 'sky',
                  },
                  {
                    title: 'Punjab Teachers Union',
                    desc: 'Professional design work for regional organisations — leadership materials, event banners, and visual communication assets that elevate institutional presence.',
                    tags: ['Visual Identity','Leadership','Punjab'],
                    color: 'indigo',
                  },
                ].map(c => (
                  <div key={c.title} className="card-lift p-8 border border-white/5 rounded-2xl bg-[#0d1424]/60">
                    <h3 className="text-lg font-bold text-white mb-3">{c.title}</h3>
                    <p className="text-sm text-slate-400 leading-relaxed mb-5">{c.desc}</p>
                    <div className="flex flex-wrap gap-2">
                      {c.tags.map(t => <Badge key={t} label={t} color={c.color} />)}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </section>

          <div className="section-divider" />

          {/* ── THE BENCH ── */}
          <section id="bench" className="py-24 max-w-6xl mx-auto px-6">
            <span className="section-num">05 // STACK</span>
            <h2 className="text-3xl font-bold text-white mt-3 mb-4">Development & Inference Tooling</h2>
            <p className="text-slate-400 text-sm mb-12 font-mono">// The complete tech matrix behind every project</p>

            <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
              {[
                { cat: 'Computation', items: ['Python','NumPy','Pandas','Jupyter'], color: 'sky' },
                { cat: 'Client Layer', items: ['React','Tailwind CSS','Vite','Babel'], color: 'indigo' },
                { cat: 'Deployment', items: ['Netlify','GitHub','Vercel','CI/CD'], color: 'emerald' },
                { cat: 'AI Models', items: ['Claude','GPT-4','Midjourney','Runway'], color: 'purple' },
                { cat: 'Design Tools', items: ['Figma','Photoshop','Canva','CapCut'], color: 'amber' },
                { cat: 'Languages', items: ['JavaScript','Python','HTML5','CSS3'], color: 'rose' },
                { cat: 'Workflow', items: ['Git','VS Code','Postman','Notion'], color: 'sky' },
                { cat: 'Platforms', items: ['Netlify','GitHub','WhatsApp API','Instagram'], color: 'indigo' },
              ].map(c => (
                <div key={c.cat} className="card-lift p-5 border border-white/5 rounded-xl bg-[#0d1424]/60">
                  <h4 className="font-mono text-[10px] text-slate-500 uppercase tracking-widest mb-3">{c.cat}</h4>
                  <div className="space-y-1.5">
                    {c.items.map(it => (
                      <div key={it} className="flex items-center gap-2">
                        <span className={`w-1 h-1 rounded-full flex-shrink-0 ${
                          c.color==='sky'?'bg-sky-400':c.color==='indigo'?'bg-indigo-400':c.color==='emerald'?'bg-emerald-400':c.color==='purple'?'bg-purple-400':c.color==='amber'?'bg-amber-400':'bg-rose-400'
                        }`}></span>
                        <span className="font-mono text-[11px] text-slate-300">{it}</span>
                      </div>
                    ))}
                  </div>
                </div>
              ))}
            </div>
          </section>

          <div className="section-divider" />

          {/* ── BLOG ── */}
          <section id="blog" className="py-24 bg-[#050810]">
            <div className="max-w-6xl mx-auto px-6">
              <span className="section-num">06 // INSIGHTS</span>
              <h2 className="text-3xl font-bold text-white mt-3 mb-12">Technical Writing & Authority</h2>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                {[
                  {
                    tag: 'Generative Pipelines',
                    tagColor: 'sky',
                    date: 'May 2026',
                    readTime: '8 min read',
                    title: 'Mastering Visual Consistency: A Deep Dive into Cinematic Image-to-Video Workflows',
                    excerpt: 'How I architect multi-stage prompt pipelines that maintain character and style coherence across long-form video generations.',
                  },
                  {
                    tag: 'Web Optimisation',
                    tagColor: 'indigo',
                    date: 'Apr 2026',
                    readTime: '6 min read',
                    title: 'Building for the Web in 2026: Why I Pair React with Netlify for Rapid Project Deployment',
                    excerpt: 'A practical walkthrough of the modern deploy stack that cuts time-to-live from days to minutes without sacrificing code quality.',
                  },
                ].map(b => (
                  <div key={b.title} className="card-lift border border-white/5 rounded-2xl p-7 bg-[#0d1424]/60 flex flex-col">
                    <div className="flex items-center justify-between mb-4">
                      <Badge label={b.tag} color={b.tagColor} />
                      <span className="font-mono text-[10px] text-slate-600">{b.date} · {b.readTime}</span>
                    </div>
                    <h3 className="text-base font-bold text-white mb-3 leading-snug">{b.title}</h3>
                    <p className="text-sm text-slate-500 leading-relaxed mb-5 flex-grow">{b.excerpt}</p>
                    <span className="font-mono text-[11px] text-sky-400/60 hover:text-sky-400 cursor-pointer transition-colors">Read Article →</span>
                  </div>
                ))}
              </div>
            </div>
          </section>

          <div className="section-divider" />

          {/* ── CONTACT ── */}
          <section id="contact" className="py-24 max-w-6xl mx-auto px-6">
            <span className="section-num">07 // CONTACT</span>
            <h2 className="text-3xl font-bold text-white mt-3 mb-12">Let's Build Something</h2>

            <div className="grid grid-cols-1 lg:grid-cols-2 gap-10">
              {/* Form */}
              <div className="terminal rounded-2xl p-8">
                <div className="terminal-bar mb-6 -mx-8 -mt-8 px-6 py-3 rounded-t-2xl">
                  <span className="dot bg-red-500/70"></span>
                  <span className="dot bg-yellow-500/70"></span>
                  <span className="dot bg-green-500/70"></span>
                  <span className="font-mono text-[10px] text-slate-500 ml-2">contact.sh</span>
                </div>
                <h3 className="text-lg font-bold text-white mb-1">Direct Communications</h3>
                <p className="text-xs font-mono text-slate-500 mb-6">// Connect for custom web platforms or prompt design assets</p>
                <form onSubmit={handleContact} className="space-y-4">
                  <div>
                    <label className="font-mono text-[10px] text-slate-500 uppercase tracking-wider block mb-1.5">Name</label>
                    <input type="text" required value={contactForm.name}
                      onChange={e => setContactForm({...contactForm, name: e.target.value})}
                      className="w-full bg-white/3 border border-white/8 rounded-lg p-3 text-sm text-white focus:border-sky-500/50 focus:outline-none font-mono transition-colors" placeholder="Your name" />
                  </div>
                  <div>
                    <label className="font-mono text-[10px] text-slate-500 uppercase tracking-wider block mb-1.5">Email</label>
                    <input type="email" required value={contactForm.email}
                      onChange={e => setContactForm({...contactForm, email: e.target.value})}
                      className="w-full bg-white/3 border border-white/8 rounded-lg p-3 text-sm text-white focus:border-sky-500/50 focus:outline-none font-mono transition-colors" placeholder="your@email.com" />
                  </div>
                  <div>
                    <label className="font-mono text-[10px] text-slate-500 uppercase tracking-wider block mb-1.5">Message</label>
                    <textarea required rows="4" value={contactForm.message}
                      onChange={e => setContactForm({...contactForm, message: e.target.value})}
                      className="w-full bg-white/3 border border-white/8 rounded-lg p-3 text-sm text-white focus:border-sky-500/50 focus:outline-none font-mono resize-none transition-colors" placeholder="Tell me about your project..."></textarea>
                  </div>
                  <button type="submit"
                    className="w-full bg-sky-500 hover:bg-sky-400 text-slate-950 font-bold p-3 rounded-lg text-sm transition-colors font-mono">
                    {submitted ? '✔ Message Sent!' : '$ send_message →'}
                  </button>
                  {submitted && <p className="text-xs font-mono text-emerald-400 text-center">Transmission received. I'll respond within 24h.</p>}
                </form>
              </div>

              {/* Right column */}
              <div className="flex flex-col gap-6">
                {/* Social links */}
                <div className="terminal rounded-2xl p-6">
                  <h3 className="font-mono text-xs text-slate-500 uppercase tracking-widest mb-4">// Reach out directly</h3>
                  <div className="grid grid-cols-2 gap-3">
                    {[
                      { label: 'GitHub', href: 'https://github.com/ainali550-cell', color: 'border-white/10 text-slate-300' },
                      { label: 'WhatsApp', href: 'https://wa.me/923029112840', color: 'border-emerald-500/20 text-emerald-400' },
                      { label: 'Instagram', href: 'https://www.instagram.com/shakoormalik39', color: 'border-pink-500/20 text-pink-400' },
                      { label: 'Facebook', href: 'https://www.facebook.com/share/1CiuBmy4NZ/?mibextid=wwXIfr', color: 'border-blue-500/20 text-blue-400' },
                    ].map(s => (
                      <a key={s.label} href={s.href} target="_blank" rel="noreferrer"
                        className={`flex items-center justify-center gap-2 p-3 bg-white/3 border ${s.color} rounded-xl font-mono text-sm hover:bg-white/6 transition-all hover:-translate-y-0.5`}>
                        {s.label}
                      </a>
                    ))}
                  </div>
                </div>

                {/* Guestbook */}
                <div className="terminal rounded-2xl p-6 flex-grow">
                  <h3 className="font-bold text-white mb-1">The Guestbook</h3>
                  <p className="font-mono text-[10px] text-slate-500 mb-5">// Sign and leave your mark</p>
                  <form onSubmit={handleGuestbook} className="flex gap-2 mb-5">
                    <input type="text" required value={gbName} onChange={e => setGbName(e.target.value)}
                      placeholder="Handle" className="w-1/3 bg-white/3 border border-white/8 rounded-lg px-3 py-2 text-xs text-white font-mono focus:outline-none focus:border-sky-500/40" />
                    <input type="text" required value={gbMsg} onChange={e => setGbMsg(e.target.value)}
                      placeholder="Leave a message..." className="flex-1 bg-white/3 border border-white/8 rounded-lg px-3 py-2 text-xs text-white font-mono focus:outline-none focus:border-sky-500/40" />
                    <button type="submit" className="bg-sky-500/10 hover:bg-sky-500/20 text-sky-400 font-mono text-xs px-3 rounded-lg border border-sky-500/20 transition-colors">Sign</button>
                  </form>
                  <div className="space-y-2 max-h-[180px] overflow-y-auto pr-1">
                    {guestbook.map((e, i) => (
                      <div key={i} className="bg-white/2 p-3 rounded-lg border border-white/4">
                        <div className="flex justify-between font-mono text-[10px] mb-1">
                          <span className="text-sky-400">@{e.name}</span>
                          <span className="text-slate-600">{e.date}</span>
                        </div>
                        <p className="text-xs text-slate-400">{e.msg}</p>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* ── FOOTER ── */}
          <footer className="border-t border-white/5 py-8 bg-[#050810]">
            <div className="max-w-6xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4">
              <div className="flex items-center gap-2">
                <span className="font-mono text-xs text-sky-400/60">{'<'}</span>
                <span className="text-sm font-bold bg-gradient-to-r from-sky-400 to-indigo-400 bg-clip-text text-transparent">SM</span>
                <span className="font-mono text-xs text-sky-400/60">{'/>'}</span>
              </div>
              <p className="font-mono text-[11px] text-slate-600">© 2026 Shakoor Malik · Pakistan 🇵🇰 · All rights reserved.</p>
              <div className="flex items-center gap-1">
                <span className="online-dot"></span>
                <span className="font-mono text-[10px] text-emerald-400/60">Available for hire</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
    </script>
</body>
</html>
